<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bit – Grafik-Test</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: "Courier New", monospace;
      background: #e9e4d8;
      color: #2e1c12;
    }
    h1 { margin: 0 0 4px; font-size: 26px; }
    h2 { margin: 32px 0 12px; font-size: 18px; }
    p  { margin: 0 0 8px; max-width: 70ch; }

    /* Alle Sprites: harte Pixelkanten, auch wenn der Browser skaliert */
    canvas { image-rendering: pixelated; display: block; }

    /* Eine Fläche pro Hintergrund (hell / dunkel) */
    .flaeche {
      display: inline-block;
      padding: 16px 20px;
      margin: 0 16px 16px 0;
      border: 4px solid #2e1c12;
      vertical-align: top;
    }
    .flaeche.hell   { background: #f4f1e8; color: #2e1c12; }
    .flaeche.dunkel { background: #1f2430; color: #e9e4d8; }

    .reihe { display: flex; align-items: flex-end; gap: 24px; margin-bottom: 12px; }
    .reihe .titel { width: 90px; font-weight: bold; align-self: center; }
    figure { margin: 0; }
    figcaption { font-size: 12px; text-align: center; margin-top: 4px; opacity: 0.75; }

    /* Palette */
    #palette { display: flex; flex-wrap: wrap; gap: 12px; }
    .farbe { display: flex; align-items: center; gap: 8px; background: #f4f1e8;
             border: 2px solid #2e1c12; padding: 6px 10px 6px 6px; font-size: 13px; }
    .farbe .muster { width: 36px; height: 36px; border: 2px solid #2e1c12; }
    .farbe b { font-size: 16px; }

    #fehler { color: #b00020; font-weight: bold; white-space: pre-line; }
  </style>
</head>
<body>
  <h1>Bit, die Informatik-Maus</h1>
  <p>Grafik-Test: drei Posen, 32 × 32 Pixel, in den Größen ×4, ×8 und ×12,
     jeweils auf hellem und dunklem Hintergrund.</p>
  <div id="fehler"></div>

  <h2>Posen</h2>
  <div id="vorschau"></div>

  <h2>Palette</h2>
  <div id="palette"></div>

  <!-- Hinweis: Diese Seite nutzt ES-Module und läuft deshalb nur über eine
       Web-Adresse (z. B. GitHub Pages), nicht per Doppelklick auf die Datei. -->
  <script type="module">
    import { BIT } from "../sprites/bit.js";
    import { setzePoseZusammen, pruefeSprite, zeichneSprite } from "../src/engine/sprite-render.js";

    // Größen und Hintergründe der Vorschau
    const FAKTOREN = [4, 8, 12];
    const HINTERGRUENDE = [
      { klasse: "hell",   titel: "Heller Hintergrund" },
      { klasse: "dunkel", titel: "Dunkler Hintergrund" },
    ];

    // Tippfehler im Sprite sofort anzeigen
    document.getElementById("fehler").textContent = pruefeSprite(BIT).join("\n");

    // Vorschau aufbauen: je Hintergrund eine Fläche, je Pose eine Reihe
    const vorschau = document.getElementById("vorschau");
    for (const hg of HINTERGRUENDE) {
      const flaeche = document.createElement("div");
      flaeche.className = "flaeche " + hg.klasse;
      flaeche.innerHTML = `<p><b>${hg.titel}</b></p>`;

      for (const [posenName, pose] of Object.entries(BIT.posen)) {
        const raster = setzePoseZusammen(BIT, posenName);
        const reihe = document.createElement("div");
        reihe.className = "reihe";
        reihe.innerHTML = `<div class="titel">${pose.titel}</div>`;

        for (const faktor of FAKTOREN) {
          const figur = document.createElement("figure");
          const canvas = document.createElement("canvas");
          zeichneSprite(canvas, raster, BIT.palette, faktor);
          const text = document.createElement("figcaption");
          text.textContent = "×" + faktor;
          figur.append(canvas, text);
          reihe.append(figur);
        }
        flaeche.append(reihe);
      }
      vorschau.append(flaeche);
    }

    // Palette anzeigen
    const paletteDiv = document.getElementById("palette");
    for (const [zeichen, eintrag] of Object.entries(BIT.palette)) {
      const kasten = document.createElement("div");
      kasten.className = "farbe";
      kasten.innerHTML =
        `<div class="muster" style="background:${eintrag.farbe}"></div>
         <div><b>${zeichen}</b> ${eintrag.name}<br>${eintrag.farbe}</div>`;
      paletteDiv.append(kasten);
    }
  </script>
</body>
</html>
